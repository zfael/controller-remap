name: Build Windows Artifact

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: controller-remap.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Compute artifact metadata
        id: metadata
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($refName)) {
            $refName = "run-${{ github.run_number }}"
          }

          $safeRefName = $refName -replace '[^A-Za-z0-9._-]', '-'
          $artifactBaseName = "controller-remap-$safeRefName-${{ matrix.target }}"

          "artifact_base_name=$artifactBaseName" >> $env:GITHUB_OUTPUT
          "artifact_path=artifacts/$artifactBaseName/${{ matrix.artifact_name }}" >> $env:GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage binary artifact
        shell: pwsh
        run: |
          $source = "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          $destination = "${{ steps.metadata.outputs.artifact_path }}"
          $artifactDir = Split-Path -Parent $destination

          if (-not (Test-Path $source)) {
            Write-Error "Expected build output not found: $source"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item $source -Destination $destination
          Get-ChildItem -Recurse $artifactDir

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_base_name }}
          path: artifacts/${{ steps.metadata.outputs.artifact_base_name }}
          if-no-files-found: error
